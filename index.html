<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아카데미UP — 가입 플로우 샘플</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #F4F5F7; }
    input, select, button, textarea { font-family: inherit; }
    ::-webkit-scrollbar { height: 4px; width: 4px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ORANGE = "#F5841F";
    const TEAL = "#17B8B8";
    const BLUE = "#378ADD";
    const DARK_HEADER = "#1E2235";
    const LIGHT_BG = "#F4F5F7";
    const LOCKED_COLOR = "#B0B8C1";

    const Logo = ({ small }) => (
      <span style={{ fontWeight: 900, fontSize: small ? 16 : 24, letterSpacing: -1 }}>
        <span style={{ color: "#E8445A" }}>아</span>
        <span style={{ color: "#F5841F" }}>카</span>
        <span style={{ color: "#2CBB6A" }}>데</span>
        <span style={{ color: "#F5C518" }}>미</span>
        <span style={{ color: "#1E2235" }}>UP</span>
      </span>
    );

    const StepBar = ({ current, steps }) => (
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 24 }}>
        {steps.map((s, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center" }}>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
              <div style={{ width: 30, height: 30, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", background: i+1===current ? ORANGE : i+1<current ? TEAL : "#E0E0E0", color: i+1<=current ? "#fff" : "#999", fontWeight: 700, fontSize: 12 }}>
                {i+1 < current ? "✓" : i+1}
              </div>
              <span style={{ fontSize: 10, color: i+1===current ? ORANGE : "#999", fontWeight: i+1===current ? 700 : 400, whiteSpace: "nowrap" }}>{s}</span>
            </div>
            {i < steps.length-1 && <div style={{ width: 44, height: 2, background: i+1<current ? TEAL : "#E0E0E0", margin: "0 4px", marginBottom: 18 }} />}
          </div>
        ))}
      </div>
    );

    const GnbHeader = ({ trialDays, isLocked }) => (
      <div>
        <div style={{ background: DARK_HEADER, padding: "0 16px", display: "flex", alignItems: "center", justifyContent: "space-between", height: 40, flexShrink: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <Logo small />
            <span style={{ color: "#aaa", fontSize: 11, borderLeft: "1px solid #444", paddingLeft: 10 }}>📚 00학원</span>
            <span style={{ color: "#ccc", fontSize: 11 }}>원장님</span>
          </div>
          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            {trialDays !== undefined && (
              <div style={{ background: "#E8445A", color: "#fff", fontSize: 10, padding: "2px 8px", borderRadius: 20, fontWeight: 700 }}>🕐 체험 D-{trialDays}일</div>
            )}
            <span style={{ color: "#aaa", fontSize: 11 }}>⚙️ 환경설정</span>
            <span style={{ color: "#aaa", fontSize: 11 }}>🔓 로그아웃</span>
          </div>
        </div>
        <div style={{ background: "#fff", borderBottom: "1px solid #e5e5e5", padding: "0 16px", display: "flex", overflowX: "auto" }}>
          {["수강생관리","수납관리","반관리","수업관리","상담관리","차량관리","직원관리","장부관리","경영현황","AI학원경영","급여관리","노무관리","회계관리"].map((m, i) => {
            const locked = isLocked && i >= 8;
            return (
              <div key={m} style={{ padding: "7px 10px", fontSize: 11, color: locked ? LOCKED_COLOR : "#555", borderBottom: i===0 ? `2px solid ${ORANGE}` : "2px solid transparent", whiteSpace: "nowrap", cursor: locked ? "not-allowed" : "pointer", flexShrink: 0 }}>
                {locked && <span style={{ fontSize: 9 }}>🔒</span>}{m}
              </div>
            );
          })}
        </div>
      </div>
    );

    const DashboardBg = () => (
      <div style={{ width: "100%", background: LIGHT_BG, pointerEvents: "none" }}>
        <GnbHeader isLocked={true} />
        <div style={{ padding: "14px 16px", display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
          {[["수강생현황","👤 재원 8명  예비 2명  퇴원 1명"],["등원현황","⬤ 60% 출석  6명/10명"],["수납현황","35% 수납 완료"]].map(([t,d]) => (
            <div key={t} style={{ background: "#fff", borderRadius: 8, padding: 16, border: "1px solid #e5e5e5" }}>
              <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 10 }}>{t}</div>
              <div style={{ fontSize: 12, color: "#888" }}>{d}</div>
            </div>
          ))}
        </div>
        <div style={{ padding: "0 16px", display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 10 }}>
          {[["💬","알림톡 발송"],["🤖","AI 이탈률"],["📊","엑셀 내보내기"],["📑","노무/회계"]].map(([icon,label]) => (
            <div key={label} style={{ background: "#fff", borderRadius: 8, padding: 14, border: "1px solid #e5e5e5", textAlign: "center" }}>
              <div style={{ fontSize: 22, marginBottom: 4 }}>{icon}</div>
              <div style={{ fontSize: 12, fontWeight: 600, color: "#555" }}>{label}</div>
            </div>
          ))}
        </div>
        <div style={{ padding: "16px", display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <div style={{ background: "#fff", borderRadius: 8, padding: 16, border: "1px solid #e5e5e5", height: 100 }}>
            <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 8 }}>상담관리</div>
            <div style={{ fontSize: 11, color: "#ccc" }}>상담 예정 3건 · 완료 12건</div>
          </div>
          <div style={{ background: "#fff", borderRadius: 8, padding: 16, border: "1px solid #e5e5e5", height: 100 }}>
            <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 8 }}>수입지출</div>
            <div style={{ fontSize: 11, color: "#ccc" }}>이번달 수입 2,400,000원</div>
          </div>
        </div>
      </div>
    );

    /* ── S1 약관동의 ── */
    const S1 = ({ go }) => {
      const [t, setT] = useState([false, false, false]); // 0:이용약관, 1:개인정보처리방침, 2:선택동의
      const [expand, setExpand] = useState(false);
      const requiredAll = t[0] && t[1];
      const all = t.every(Boolean);
      const tog = (i) => { const n=[...t]; n[i]=!n[i]; setT(n); };
      const togAll = () => { const v=!all; setT([v,v,v]); };
      const TERMS = [
        { label:"이용약관에 동의합니다.", tag:"필수", req:true },
        { label:"개인정보 취급방침에 동의합니다.", tag:"필수", req:true },
      ];
      return (
        <div style={{ minHeight:"100vh", background:LIGHT_BG, display:"flex", flexDirection:"column", alignItems:"center", padding:"32px 16px" }}>
          <Logo /><div style={{ fontSize:13, color:"#666", margin:"12px 0 20px", fontWeight:500 }}>이용 가입신청</div>
          <StepBar current={1} steps={["약관동의","정보입력","인증완료"]} />
          <div style={{ background:"#fff", borderRadius:8, border:"1px solid #e5e5e5", width:"100%", maxWidth:440, padding:24 }}>
            <div style={{ fontSize:15, fontWeight:700, marginBottom:4 }}>약관동의</div>
            <div style={{ fontSize:11, color:"#888", marginBottom:16 }}>필수 항목 동의를 거부하면 서비스 이용이 제한됩니다.</div>

            {/* 모두 동의 */}
            <div onClick={togAll} style={{ border:`2px solid ${all?ORANGE:"#e0e0e0"}`, borderRadius:6, padding:"10px 14px", display:"flex", alignItems:"center", gap:8, cursor:"pointer", marginBottom:10, background:all?"#fff9f3":"#fff" }}>
              <div style={{ width:16, height:16, borderRadius:3, background:all?ORANGE:"#ddd", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>{all&&<span style={{ color:"#fff", fontSize:10 }}>✓</span>}</div>
              <span style={{ fontSize:13, fontWeight:600 }}>모두 동의합니다.</span>
              <span style={{ fontSize:10, color:"#aaa", marginLeft:"auto" }}>필수+선택 포함</span>
            </div>

            {/* 구분선 */}
            <div style={{ borderTop:"1px solid #f0f0f0", marginBottom:10 }} />

            {/* 필수 항목 */}
            {TERMS.map((item, i) => (
              <div key={i} onClick={()=>tog(i)} style={{ border:`1px solid ${t[i]?"#e0d0c0":"#e0e0e0"}`, borderRadius:6, padding:"10px 14px", display:"flex", alignItems:"center", gap:8, cursor:"pointer", marginBottom:6, background:t[i]?"#fff9f3":"#fff" }}>
                <div style={{ width:14, height:14, borderRadius:3, background:t[i]?ORANGE:"#ddd", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>{t[i]&&<span style={{ color:"#fff", fontSize:9 }}>✓</span>}</div>
                <span style={{ fontSize:12, flex:1 }}>{item.label}</span>
                <span style={{ fontSize:10, color:"#E8445A", fontWeight:600, marginRight:6 }}>{item.tag}</span>
                <span style={{ fontSize:11, color:TEAL }}>보기</span>
              </div>
            ))}

            {/* 구분선 */}
            <div style={{ borderTop:"1px solid #f0f0f0", margin:"10px 0" }} />

            {/* 선택 동의 항목 */}
            <div onClick={()=>tog(2)} style={{ border:`1px solid ${t[2]?"#C8E0F7":"#e0e0e0"}`, borderRadius:6, padding:"10px 14px", display:"flex", alignItems:"center", gap:8, cursor:"pointer", marginBottom:6, background:t[2]?"#F0F7FF":"#fff" }}>
              <div style={{ width:14, height:14, borderRadius:3, background:t[2]?BLUE:"#ddd", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>{t[2]&&<span style={{ color:"#fff", fontSize:9 }}>✓</span>}</div>
              <span style={{ fontSize:12, flex:1 }}>개인정보 수집·이용에 동의합니다.</span>
              <span style={{ fontSize:10, color:BLUE, fontWeight:600, marginRight:6 }}>선택</span>
              <span onClick={e=>{e.stopPropagation();setExpand(!expand);}} style={{ fontSize:11, color:TEAL, cursor:"pointer" }}>{expand?"닫기":"보기"}</span>
            </div>

            {/* 선택 동의 상세 내용 */}
            {expand && (
              <div style={{ background:"#F8FBFF", border:"1px solid #C8E0F7", borderRadius:6, padding:"12px 14px", marginBottom:8, fontSize:11, color:"#555", lineHeight:1.9 }}>
                <div style={{ fontWeight:700, color:BLUE, marginBottom:6 }}>개인정보 수집·이용 안내</div>
                <div><span style={{ color:"#888", marginRight:4 }}>수집 항목</span>암호화된 휴대폰 식별값 (원본 복원 불가)</div>
                <div><span style={{ color:"#888", marginRight:4 }}>수집 목적</span>서비스 이용 중단 후 재가입 감지, 혜택 중복 지급 방지</div>
                <div><span style={{ color:"#888", marginRight:4 }}>보관 기간</span>서비스 이용 중단 시점으로부터 1년 후 파기</div>
                <div style={{ marginTop:6, color:"#999", fontSize:10, lineHeight:1.7 }}>
                  ※ 동의 거부 시에도 서비스 가입은 가능합니다.<br/>
                  단, 재가입 시 이전 이용 이력 확인 및 연합회 혜택 적용이 제한될 수 있습니다.
                </div>
              </div>
            )}

            <button onClick={()=>requiredAll&&go(1)} style={{ width:"100%", padding:"12px 0", background:requiredAll?ORANGE:"#ccc", color:"#fff", border:"none", borderRadius:6, fontSize:14, fontWeight:700, cursor:requiredAll?"pointer":"not-allowed", marginTop:14 }}>다음</button>
            <button style={{ width:"100%", padding:"10px 0", background:"#f5f5f5", color:"#888", border:"none", borderRadius:6, fontSize:13, cursor:"pointer", marginTop:6 }}>취소</button>
          </div>
          <div style={{ marginTop:24, fontSize:11, color:"#aaa" }}>GNB 지앤비시스템 · Copyright ⓒ GNBSYSTEM corp.</div>
        </div>
      );
    };

    /* ── S2 정보입력 ── */
    const S2 = ({ go }) => {
      const [f, setF] = useState({ academy:"", name:"", phone:"", email:"" });
      const [routes, setRoutes] = useState([]);
      const [region, setRegion] = useState("");
      const valid = f.academy && f.name && f.phone && f.email;
      const upd = (k,v) => setF({...f,[k]:v});
      const toggleRoute = (r) => setRoutes(prev => prev.includes(r) ? prev.filter(x=>x!==r) : [...prev, r]);
      const ROUTES = ["검색","SNS","지인추천","연합회","기타"];
      return (
        <div style={{ minHeight:"100vh", background:LIGHT_BG, display:"flex", flexDirection:"column", alignItems:"center", padding:"32px 16px" }}>
          <Logo /><div style={{ fontSize:13, color:"#666", margin:"12px 0 20px", fontWeight:500 }}>이용 가입신청</div>
          <StepBar current={2} steps={["약관동의","정보입력","인증완료"]} />
          <div style={{ background:"#fff", borderRadius:8, border:"1px solid #e5e5e5", width:"100%", maxWidth:440, padding:24 }}>
            <div style={{ fontSize:15, fontWeight:700, marginBottom:16 }}>기본 정보 입력</div>
            {[["학원명","academy","학원명을 입력하세요"],["대표자 이름","name","대표자 이름"],["전화번호","phone","010-0000-0000"],["이메일","email","example@email.com"]].map(([label,key,ph]) => (
              <div key={key} style={{ marginBottom:12 }}>
                <label style={{ fontSize:12, fontWeight:600, color:"#444", display:"block", marginBottom:4 }}>{label} <span style={{ color:"red" }}>*</span></label>
                <input value={f[key]} onChange={e=>upd(key,e.target.value)} placeholder={ph} style={{ width:"100%", padding:"9px 11px", border:"1px solid #ddd", borderRadius:6, fontSize:12, outline:"none" }} />
              </div>
            ))}
            <div style={{ marginBottom:14 }}>
              <label style={{ fontSize:12, fontWeight:600, color:"#444", display:"block", marginBottom:8 }}>가입경로 (선택)</label>
              <div style={{ display:"flex", gap:8, flexWrap:"nowrap" }}>
                {ROUTES.map(r => {
                  const on = routes.includes(r);
                  return (
                    <div key={r} onClick={()=>toggleRoute(r)} style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", gap:5, cursor:"pointer", padding:"8px 4px", border:`1.5px solid ${on?ORANGE:"#ddd"}`, borderRadius:6, background:on?"#FFF9F3":"#fff" }}>
                      <div style={{ width:13, height:13, borderRadius:3, border:`2px solid ${on?ORANGE:"#ccc"}`, background:on?ORANGE:"#fff", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                        {on&&<span style={{ color:"#fff", fontSize:9 }}>✓</span>}
                      </div>
                      <span style={{ fontSize:11, fontWeight:on?700:400, color:on?ORANGE:"#555", whiteSpace:"nowrap" }}>{r}</span>
                    </div>
                  );
                })}
              </div>
              {routes.includes("연합회") && (
                <div style={{ marginTop:10 }}>
                  <label style={{ fontSize:11, fontWeight:600, color:"#555", display:"block", marginBottom:6 }}>연합회 지역 선택</label>
                  <select value={region} onChange={e=>setRegion(e.target.value)} style={{ width:"100%", padding:"9px 11px", border:`1px solid ${region?ORANGE:"#ddd"}`, borderRadius:6, fontSize:12, background:"#fff", outline:"none" }}>
                    <option value="">지역을 선택하세요</option>
                    <option>대전</option>
                    <option>대구</option>
                  </select>
                </div>
              )}
            </div>
            <div style={{ background:"#FFF8F0", border:"1px solid #FFD9A8", borderRadius:6, padding:"8px 12px", fontSize:11, color:ORANGE, marginBottom:14 }}>
              ℹ️ 사업자번호·주소는 정식 전환 단계에서 입력합니다.
            </div>
            <button onClick={() => valid&&go(2)} style={{ width:"100%", padding:"12px 0", background:valid?ORANGE:"#ccc", color:"#fff", border:"none", borderRadius:6, fontSize:14, fontWeight:700, cursor:valid?"pointer":"not-allowed" }}>다음 — 휴대폰 인증</button>
          </div>
        </div>
      );
    };

    /* ── S3 휴대폰인증 ── */
    const S3 = ({ go }) => {
      const [phone, setPhone] = useState("");
      const [scenario, setScenario] = useState(null); // null | "normal" | "recoverable" | "deleted"
      const [sent, setSent] = useState(false);
      const [otp, setOtp] = useState("");
      const [timer, setTimer] = useState(180);
      const [ok, setOk] = useState(false);

      useEffect(() => {
        if (sent && timer > 0 && !ok) { const t=setTimeout(()=>setTimer(s=>s-1),1000); return ()=>clearTimeout(t); }
      }, [sent, timer, ok]);
      const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;

      const handleSend = () => {
        const p = phone.replace(/-/g,"");
        if(p==="01011111111") { setScenario("deleted"); return; }
        setScenario("normal");
        setSent(true);
      };

      // ── 이탈 이력 감지: 데이터 파기 완료 ──
      if(scenario==="deleted") return (
        <div style={{ minHeight:"100vh", background:LIGHT_BG, display:"flex", flexDirection:"column", alignItems:"center", padding:"32px 16px" }}>
          <Logo /><div style={{ fontSize:13, color:"#666", margin:"12px 0 20px", fontWeight:500 }}>이용 가입신청</div>
          <StepBar current={3} steps={["약관동의","정보입력","인증완료"]} />
          <div style={{ background:"#fff", borderRadius:8, border:"1px solid #e5e5e5", width:"100%", maxWidth:440, padding:24 }}>
            <div style={{ fontSize:16, marginBottom:10 }}>🔍</div>
            <div style={{ fontSize:15, fontWeight:700, marginBottom:6 }}>이전 가입 이력이 확인됩니다</div>
            <div style={{ fontSize:12, color:"#888", marginBottom:18, lineHeight:1.7 }}>입력하신 번호로 아카데미업을 가입하신 이력이 있습니다.</div>
            <div style={{ background:"#FFF5F5", border:"1px solid #F0C4C4", borderRadius:8, padding:"14px 16px", marginBottom:16 }}>
              <div style={{ fontSize:12, fontWeight:700, color:"#E8445A", marginBottom:6 }}>⚠️ 기존 데이터 복구 불가</div>
              <div style={{ fontSize:11, color:"#555", lineHeight:1.8 }}>
                계정 삭제 처리가 완료되어 기존 데이터 복구는 어렵습니다.<br/>
                신규로 다시 가입하여 새롭게 계정을 생성해보세요!
              </div>
            </div>
            <div style={{ background:"#F8F9FA", borderRadius:6, padding:"10px 14px", marginBottom:18, fontSize:11, color:"#888", lineHeight:1.7 }}>
              💡 처음 가입하시는 것처럼 동일하게 진행됩니다.<br/>
              가입 후 초기 설정이 필요하시면 고객센터에서 도움드릴 수 있습니다.
            </div>
            <button onClick={()=>go(3)} style={{ width:"100%", padding:"12px 0", background:ORANGE, color:"#fff", border:"none", borderRadius:6, fontSize:13, fontWeight:700, cursor:"pointer" }}>가입 진행하기</button>
            <div style={{ textAlign:"center", marginTop:12 }}>
              <span onClick={()=>{setScenario(null);setPhone("");}} style={{ fontSize:11, color:"#aaa", cursor:"pointer", textDecoration:"underline" }}>← 다른 번호로 다시 시도</span>
            </div>
          </div>
        </div>
      );

      // ── 일반 인증 흐름 ──
      return (
        <div style={{ minHeight:"100vh", background:LIGHT_BG, display:"flex", flexDirection:"column", alignItems:"center", padding:"32px 16px" }}>
          <Logo /><div style={{ fontSize:13, color:"#666", margin:"12px 0 20px", fontWeight:500 }}>이용 가입신청</div>
          <StepBar current={3} steps={["약관동의","정보입력","인증완료"]} />
