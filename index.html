<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아카데미UP — 가입 플로우 샘플</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #F4F5F7; }
    input, select, button, textarea { font-family: inherit; }
    ::-webkit-scrollbar { height: 4px; width: 4px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ORANGE = "#F5841F";
    const TEAL = "#17B8B8";
    const DARK_HEADER = "#1E2235";
    const LIGHT_BG = "#F4F5F7";
    const LOCKED_COLOR = "#B0B8C1";

    const Logo = ({ small }) => (
      <span style={{ fontWeight: 900, fontSize: small ? 16 : 24, letterSpacing: -1 }}>
        <span style={{ color: "#E8445A" }}>아</span>
        <span style={{ color: "#F5841F" }}>카</span>
        <span style={{ color: "#2CBB6A" }}>데</span>
        <span style={{ color: "#F5C518" }}>미</span>
        <span style={{ color: "#1E2235" }}>UP</span>
      </span>
    );

    const StepBar = ({ current, steps }) => (
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 24 }}>
        {steps.map((s, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center" }}>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
              <div style={{ width: 30, height: 30, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", background: i+1===current ? ORANGE : i+1<current ? TEAL : "#E0E0E0", color: i+1<=current ? "#fff" : "#999", fontWeight: 700, fontSize: 12 }}>
                {i+1 < current ? "✓" : i+1}
              </div>
              <span style={{ fontSize: 10, color: i+1===current ? ORANGE : "#999", fontWeight: i+1===current ? 700 : 400, whiteSpace: "nowrap" }}>{s}</span>
            </div>
            {i < steps.length-1 && <div style={{ width: 44, height: 2, background: i+1<current ? TEAL : "#E0E0E0", margin: "0 4px", marginBottom: 18 }} />}
          </div>
        ))}
      </div>
    );

    const GnbHeader = ({ trialDays, isLocked }) => (
      <div>
        <div style={{ background: DARK_HEADER, padding: "0 16px", display: "flex", alignItems: "center", justifyContent: "space-between", height: 40, flexShrink: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <Logo small />
            <span style={{ color: "#aaa", fontSize: 11, borderLeft: "1px solid #444", paddingLeft: 10 }}>📚 00학원</span>
            <span style={{ color: "#ccc", fontSize: 11 }}>원장님</span>
          </div>
          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            {trialDays !== undefined && (
              <div style={{ background: "#E8445A", color: "#fff", fontSize: 10, padding: "2px 8px", borderRadius: 20, fontWeight: 700 }}>🕐 체험 D-{trialDays}일</div>
            )}
            <span style={{ color: "#aaa", fontSize: 11 }}>⚙️ 환경설정</span>
            <span style={{ color: "#aaa", fontSize: 11 }}>🔓 로그아웃</span>
          </div>
        </div>
        <div style={{ background: "#fff", borderBottom: "1px solid #e5e5e5", padding: "0 16px", display: "flex", overflowX: "auto" }}>
          {["수강생관리","수납관리","반관리","수업관리","상담관리","차량관리","직원관리","장부관리","경영현황","AI학원경영","급여관리","노무관리","회계관리"].map((m, i) => {
            const locked = isLocked && i >= 8;
            return (
              <div key={m} style={{ padding: "7px 10px", fontSize: 11, color: locked ? LOCKED_COLOR : "#555", borderBottom: i===0 ? `2px solid ${ORANGE}` : "2px solid transparent", whiteSpace: "nowrap", cursor: locked ? "not-allowed" : "pointer", flexShrink: 0 }}>
                {locked && <span style={{ fontSize: 9 }}>🔒</span>}{m}
              </div>
            );
          })}
        </div>
      </div>
    );

    const DashboardBg = () => (
      <div style={{ width: "100%", background: LIGHT_BG, pointerEvents: "none" }}>
        <GnbHeader isLocked={true} />
        <div style={{ padding: "14px 16px", display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
          {[["수강생현황","👤 재원 8명  예비 2명  퇴원 1명"],["등원현황","⬤ 60% 출석  6명/10명"],["수납현황","35% 수납 완료"]].map(([t,d]) => (
            <div key={t} style={{ background: "#fff", borderRadius: 8, padding: 16, border: "1px solid #e5e5e5" }}>
              <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 10 }}>{t}</div>
              <div style={{ fontSize: 12, color: "#888" }}>{d}</div>
            </div>
          ))}
        </div>
        <div style={{ padding: "0 16px", display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 10 }}>
          {[["💬","알림톡 발송"],["🤖","AI 이탈률"],["📊","엑셀 내보내기"],["📑","노무/회계"]].map(([icon,label]) => (
            <div key={label} style={{ background: "#fff", borderRadius: 8, padding: 14, border: "1px solid #e5e5e5", textAlign: "center" }}>
              <div style={{ fontSize: 22, marginBottom: 4 }}>{icon}</div>
              <div style={{ fontSize: 12, fontWeight: 600, color: "#555" }}>{label}</div>
            </div>
          ))}
        </div>
        <div style={{ padding: "16px", display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <div style={{ background: "#fff", borderRadius: 8, padding: 16, border: "1px solid #e5e5e5", height: 100 }}>
            <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 8 }}>상담관리</div>
            <div style={{ fontSize: 11, color: "#ccc" }}>상담 예정 3건 · 완료 12건</div>
          </div>
          <div style={{ background: "#fff", borderRadius: 8, padding: 16, border: "1px solid #e5e5e5", height: 100 }}>
            <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 8 }}>수입지출</div>
            <div style={{ fontSize: 11, color: "#ccc" }}>이번달 수입 2,400,000원</div>
          </div>
        </div>
      </div>
    );

    /* ── S1 약관동의 ── */
    const S1 = ({ go }) => {
      const [all, setAll] = useState(false);
      const [t, setT] = useState([false, false]);
      const tog = (i) => { const n=[...t]; n[i]=!n[i]; setT(n); setAll(n.every(Boolean)); };
      const togAll = () => { const v=!all; setAll(v); setT([v,v]); };
      return (
        <div style={{ minHeight:"100vh", background:LIGHT_BG, display:"flex", flexDirection:"column", alignItems:"center", padding:"32px 16px" }}>
          <Logo /><div style={{ fontSize:13, color:"#666", margin:"12px 0 20px", fontWeight:500 }}>이용 가입신청</div>
          <StepBar current={1} steps={["약관동의","정보입력","인증완료"]} />
          <div style={{ background:"#fff", borderRadius:8, border:"1px solid #e5e5e5", width:"100%", maxWidth:440, padding:24 }}>
            <div style={{ fontSize:15, fontWeight:700, marginBottom:4 }}>약관동의</div>
            <div style={{ fontSize:11, color:"#888", marginBottom:16 }}>필수 항목 동의를 거부하면 서비스 이용이 제한됩니다.</div>
            <div onClick={togAll} style={{ border:`2px solid ${all?ORANGE:"#e0e0e0"}`, borderRadius:6, padding:"10px 14px", display:"flex", alignItems:"center", gap:8, cursor:"pointer", marginBottom:8, background:all?"#fff9f3":"#fff" }}>
              <div style={{ width:16, height:16, borderRadius:3, background:all?ORANGE:"#ddd", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>{all&&<span style={{ color:"#fff", fontSize:10 }}>✓</span>}</div>
              <span style={{ fontSize:13, fontWeight:600 }}>모두 동의합니다.</span>
            </div>
            {["이용약관에 동의합니다. (필수)","개인정보 취급방침에 동의합니다. (필수)"].map((tx,i) => (
              <div key={i} onClick={() => tog(i)} style={{ border:"1px solid #e0e0e0", borderRadius:6, padding:"10px 14px", display:"flex", alignItems:"center", gap:8, cursor:"pointer", marginBottom:6, background:"#fff" }}>
                <div style={{ width:14, height:14, borderRadius:3, background:t[i]?ORANGE:"#ddd", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>{t[i]&&<span style={{ color:"#fff", fontSize:9 }}>✓</span>}</div>
                <span style={{ fontSize:12, flex:1 }}>{tx}</span>
                <span style={{ fontSize:11, color:TEAL }}>보기</span>
              </div>
            ))}
            <button onClick={() => all&&go(1)} style={{ width:"100%", padding:"12px 0", background:all?ORANGE:"#ccc", color:"#fff", border:"none", borderRadius:6, fontSize:14, fontWeight:700, cursor:all?"pointer":"not-allowed", marginTop:14 }}>다음</button>
            <button style={{ width:"100%", padding:"10px 0", background:"#f5f5f5", color:"#888", border:"none", borderRadius:6, fontSize:13, cursor:"pointer", marginTop:6 }}>취소</button>
          </div>
          <div style={{ marginTop:24, fontSize:11, color:"#aaa" }}>GNB 지앤비시스템 · Copyright ⓒ GNBSYSTEM corp.</div>
        </div>
      );
    };

    /* ── S2 정보입력 ── */
    const S2 = ({ go }) => {
      const [f, setF] = useState({ academy:"", name:"", phone:"", email:"", route:"" });
      const valid = f.academy && f.name && f.phone && f.email;
      const upd = (k,v) => setF({...f,[k]:v});
      return (
        <div style={{ minHeight:"100vh", background:LIGHT_BG, display:"flex", flexDirection:"column", alignItems:"center", padding:"32px 16px" }}>
          <Logo /><div style={{ fontSize:13, color:"#666", margin:"12px 0 20px", fontWeight:500 }}>이용 가입신청</div>
          <StepBar current={2} steps={["약관동의","정보입력","인증완료"]} />
          <div style={{ background:"#fff", borderRadius:8, border:"1px solid #e5e5e5", width:"100%", maxWidth:440, padding:24 }}>
            <div style={{ fontSize:15, fontWeight:700, marginBottom:16 }}>기본 정보 입력</div>
            {[["학원명","academy","학원명을 입력하세요"],["대표자 이름","name","대표자 이름"],["전화번호","phone","010-0000-0000"],["이메일","email","example@email.com"]].map(([label,key,ph]) => (
              <div key={key} style={{ marginBottom:12 }}>
                <label style={{ fontSize:12, fontWeight:600, color:"#444", display:"block", marginBottom:4 }}>{label} <span style={{ color:"red" }}>*</span></label>
                <input value={f[key]} onChange={e=>upd(key,e.target.value)} placeholder={ph} style={{ width:"100%", padding:"9px 11px", border:"1px solid #ddd", borderRadius:6, fontSize:12, outline:"none" }} />
              </div>
            ))}
            <div style={{ marginBottom:14 }}>
              <label style={{ fontSize:12, fontWeight:600, color:"#444", display:"block", marginBottom:4 }}>가입경로 (선택)</label>
              <select value={f.route} onChange={e=>upd("route",e.target.value)} style={{ width:"100%", padding:"9px 11px", border:"1px solid #ddd", borderRadius:6, fontSize:12, background:"#fff" }}>
                <option value="">선택하세요</option>
                <option>검색</option><option>지인추천</option><option>SNS</option><option>기타</option>
              </select>
            </div>
            <div style={{ background:"#FFF8F0", border:"1px solid #FFD9A8", borderRadius:6, padding:"8px 12px", fontSize:11, color:ORANGE, marginBottom:14 }}>
              ℹ️ 사업자번호·주소는 정식 전환 단계에서 입력합니다.
            </div>
            <button onClick={() => valid&&go(2)} style={{ width:"100%", padding:"12px 0", background:valid?ORANGE:"#ccc", color:"#fff", border:"none", borderRadius:6, fontSize:14, fontWeight:700, cursor:valid?"pointer":"not-allowed" }}>다음 — 휴대폰 인증</button>
          </div>
        </div>
      );
    };

    /* ── S3 휴대폰인증 ── */
    const S3 = ({ go }) => {
      const [sent, setSent] = useState(false);
      const [otp, setOtp] = useState("");
      const [timer, setTimer] = useState(180);
      const [ok, setOk] = useState(false);
      useEffect(() => {
        if (sent && timer > 0 && !ok) { const t=setTimeout(()=>setTimer(s=>s-1),1000); return ()=>clearTimeout(t); }
      }, [sent, timer, ok]);
      const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
      return (
        <div style={{ minHeight:"100vh", background:LIGHT_BG, display:"flex", flexDirection:"column", alignItems:"center", padding:"32px 16px" }}>
          <Logo /><div style={{ fontSize:13, color:"#666", margin:"12px 0 20px", fontWeight:500 }}>이용 가입신청</div>
          <StepBar current={3} steps={["약관동의","정보입력","인증완료"]} />
          <div style={{ background:"#fff", borderRadius:8, border:"1px solid #e5e5e5", width:"100%", maxWidth:440, padding:24 }}>
            <div style={{ fontSize:15, fontWeight:700, marginBottom:4 }}>휴대폰 본인인증</div>
            <div style={{ fontSize:11, color:"#888", marginBottom:16 }}>동일 번호 중복 가입은 자동 차단됩니다.</div>
            <div style={{ background:"#F8F9FA", borderRadius:6, padding:"10px 14px", marginBottom:16, fontSize:12 }}>인증번호 수신: <strong>010-1234-5678</strong></div>
            {!sent ? (
              <button onClick={()=>setSent(true)} style={{ width:"100%", padding:"11px 0", background:TEAL, color:"#fff", border:"none", borderRadius:6, fontSize:13, fontWeight:700, cursor:"pointer" }}>인증번호 발송</button>
            ) : (
              <>
                <div style={{ display:"flex", gap:8, marginBottom:8 }}>
                  <div style={{ position:"relative", flex:1 }}>
                    <input value={otp} onChange={e=>setOtp(e.target.value)} placeholder="인증번호 6자리" disabled={ok}
                      style={{ width:"100%", padding:"10px 11px", border:`1px solid ${ok?TEAL:"#ddd"}`, borderRadius:6, fontSize:13, outline:"none" }} />
                    {!ok && <span style={{ position:"absolute", right:10, top:"50%", transform:"translateY(-50%)", fontSize:12, color:timer<60?"red":ORANGE, fontWeight:700 }}>{fmt(timer)}</span>}
                  </div>
                  {!ok && <button onClick={()=>otp==="123456"&&setOk(true)} style={{ padding:"0 14px", background:ORANGE, color:"#fff", border:"none", borderRadius:6, fontSize:12, fontWeight:700, cursor:"pointer" }}>확인</button>}
                </div>
                {!ok && <div style={{ fontSize:11, color:"#888", marginBottom:8 }}>테스트 인증번호: <strong>123456</strong></div>}
                {ok && <div style={{ background:"#E8F8F2", border:"1px solid #A8DFC4", borderRadius:6, padding:"10px 14px", fontSize:12, color:"#2CBB6A", fontWeight:600, marginBottom:12 }}>✅ 인증 완료!</div>}
              </>
            )}
            <button onClick={()=>ok&&go(3)} style={{ width:"100%", padding:"12px 0", background:ok?ORANGE:"#ccc", color:"#fff", border:"none", borderRadius:6, fontSize:14, fontWeight:700, cursor:ok?"pointer":"not-allowed", marginTop:10 }}>체험 계정 발급받기</button>
          </div>
        </div>
      );
    };

    /* ── S4 계정발급완료 ── */
    const S4 = ({ go }) => (
      <div style={{ minHeight:"100vh", background:LIGHT_BG, display:"flex", alignItems:"center", justifyContent:"center", padding:16 }}>
        <div style={{ background:"#fff", borderRadius:12, border:"1px solid #e5e5e5", width:"100%", maxWidth:440, padding:32, textAlign:"center" }}>
          <div style={{ fontSize:44, marginBottom:12 }}>🎉</div><Logo />
          <div style={{ fontSize:16, fontWeight:700, marginTop:14, marginBottom:8 }}>체험 계정이 발급됐습니다!</div>
          <div style={{ fontSize:12, color:"#888", marginBottom:20, lineHeight:1.7 }}>아래 정보로 로그인하여 7일간 자유롭게 체험해보세요.<br/>알림톡으로도 안내 문자가 발송되었습니다.</div>
          <div style={{ background:"#F8F9FA", borderRadius:8, padding:"14px 20px", marginBottom:16, textAlign:"left" }}>
            {[["아이디","acadup_00001"],["임시 비밀번호","Test1234!"],["체험 기간","7일 (D-7)"]].map(([k,v]) => (
              <div key={k} style={{ fontSize:12, marginBottom:6, display:"flex", gap:8 }}>
                <span style={{ color:"#888", width:80 }}>{k}</span>
                <strong style={{ color:k==="체험 기간"?"#E8445A":"#333" }}>{v}</strong>
              </div>
            ))}
          </div>
          <div style={{ background:"#FFF3E0", borderRadius:6, padding:"8px 12px", fontSize:11, color:ORANGE, marginBottom:20, textAlign:"left" }}>📹 시작 가이드 영상을 먼저 확인하시면 더 빠르게 적응하실 수 있어요.</div>
          <button onClick={()=>go(4)} style={{ width:"100%", padding:"12px 0", background:ORANGE, color:"#fff", border:"none", borderRadius:6, fontSize:14, fontWeight:700, cursor:"pointer" }}>지금 바로 시작하기 →</button>
        </div>
      </div>
    );

    /* ── S5 온보딩 ── */
    const S5 = ({ go }) => {
      const [step, setStep] = useState(0);
      const [done, setDone] = useState([false,false,false]);
      const missions = [
        { icon:"👤", title:"미션 1", desc:"원생 1명 등록하기", detail:"이름 + 연락처만으로 완료!" },
        { icon:"📚", title:"미션 2", desc:"반 만들고 원생 배정", detail:"수업 그룹을 구성해보세요" },
        { icon:"✅", title:"미션 3", desc:"출결 또는 수납 체험", detail:"핵심 기능을 직접 경험해보세요" },
      ];
      const complete = () => { const n=[...done]; n[step]=true; setDone(n); if(step<2) setStep(step+1); };
      const allDone = done.every(Boolean);
      return (
        <div style={{ minHeight:"100vh", background:"rgba(30,34,53,0.88)", display:"flex", alignItems:"center", justifyContent:"center", padding:16 }}>
          <div style={{ background:"#fff", borderRadius:12, width:"100%", maxWidth:480, padding:28, boxShadow:"0 20px 60px rgba(0,0,0,0.3)" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 }}>
              <div><div style={{ fontSize:16, fontWeight:700 }}>🚀 빠른 시작 가이드</div><div style={{ fontSize:11, color:"#888", marginTop:2 }}>3가지 미션을 완료하면 핵심 기능을 바로 익힐 수 있어요</div></div>
              <div style={{ fontSize:12, fontWeight:700, color:ORANGE }}>{done.filter(Boolean).length} / 3 완료</div>
            </div>
            <div style={{ background:"#f0f0f0", borderRadius:8, height:6, marginBottom:18, overflow:"hidden" }}>
              <div style={{ height:6, background:ORANGE, borderRadius:8, width:`${(done.filter(Boolean).length/3)*100}%`, transition:"width 0.4s" }} />
            </div>
            {missions.map((m,i) => (
              <div key={i} onClick={()=>setStep(i)} style={{ border:`2px solid ${step===i?ORANGE:done[i]?TEAL:"#e5e5e5"}`, borderRadius:8, padding:"12px 14px", marginBottom:8, cursor:"pointer", background:done[i]?"#F0FBF7":step===i?"#FFF9F3":"#fff", display:"flex", alignItems:"center", gap:12 }}>
                <div style={{ fontSize:22 }}>{m.icon}</div>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:10, color:"#888" }}>{m.title}</div>
                  <div style={{ fontSize:13, fontWeight:600 }}>{m.desc}</div>
                  <div style={{ fontSize:10, color:"#aaa" }}>{m.detail}</div>
                </div>
                <div style={{ width:22, height:22, borderRadius:"50%", background:done[i]?TEAL:"#e0e0e0", display:"flex", alignItems:"center", justifyContent:"center" }}>
                  {done[i]&&<span style={{ color:"#fff", fontSize:11 }}>✓</span>}
                </div>
              </div>
            ))}
            <div style={{ display:"flex", gap:8, marginTop:16 }}>
              {!allDone && <button onClick={complete} style={{ flex:1, padding:"11px 0", background:ORANGE, color:"#fff", border:"none", borderRadius:6, fontSize:13, fontWeight:700, cursor:"pointer" }}>미션 완료 ✓</button>}
              <button onClick={()=>go(5)} style={{ flex:allDone?2:1, padding:"11px 0", background:allDone?TEAL:"#f0f0f0", color:allDone?"#fff":"#888", border:"none", borderRadius:6, fontSize:13, fontWeight:700, cursor:"pointer" }}>
                {allDone?"🎉 대시보드로 이동":"나중에 할게요"}
              </button>
            </div>
          </div>
        </div>

        link:       { bg:"#E8F0FF", border:"#A8C4F0", color:"#378ADD", icon:"🔗", label:"연동 가능",  text:"기존 기기로 아카데미업 연동이 가능합니다. (신규 기기 지급 없음)" },
        block_van:  { bg:"#FFF0F0", border:"#F0A8A8", color:"#E8445A", icon:"⚠️", label:"설치 불가",  text:"신규 단말기 지급이 어렵습니다. 비대면결제 단독 사용을 권장드립니다." },
        block_toss: { bg:"#FFF0F0", border:"#F0A8A8", color:"#E8445A", icon:"⚠️", label:"설치 불가",  text:"토스 청약 해지 후 재신청 가능합니다." },
        wait:       { bg:"#FFFBE8", border:"#F0DFA8", color:ORANGE,    icon:"🕐", label:"대기",       text:"약정 만료 후 설치 가능합니다. 만료일을 저장하여 때맞춰 연락드립니다." },
      };
      const filled = Object.values(f).filter(Boolean).length >= 4;
      return (
        <div style={{ minHeight:"100vh", background:LIGHT_BG, display:"flex", flexDirection:"column", alignItems:"center", padding:"32px 16px" }}>
          <Logo /><div style={{ margin:"12px 0 20px" }} />
          <StepBar current={2} steps={["비대면결제 접수","단말기 신청","완료"]} />
          <div style={{ background:"#fff", borderRadius:8, border:"1px solid #e5e5e5", width:"100%", maxWidth:480, padding:24 }}>
            <div style={{ fontSize:15, fontWeight:700, marginBottom:4 }}>🖥️ 토스프론트 단말기 신청</div>
            <div style={{ fontSize:11, color:"#888", marginBottom:20 }}>아래 항목을 선택하시면 설치 가능 여부를 자동으로 판단합니다.</div>
            {questions.map(q=>(
              <div key={q.key} style={{ marginBottom:18 }}>
                <div style={{ fontSize:13, fontWeight:700, color:"#333", marginBottom:10 }}>{q.label}</div>
                <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                  {q.opts.map(o=>(
                    <div key={o} onClick={()=>setF({...f,[q.key]:o})} style={{ display:"flex", alignItems:"center", gap:10, cursor:"pointer", padding:"10px 14px", border:`1.5px solid ${f[q.key]===o?ORANGE:"#e0e0e0"}`, borderRadius:8, background:f[q.key]===o?"#FFF9F3":"#fff" }}>

                    </div>

              </div>

            {!result&&filled&&<button onClick={check} style={{ width:"100%", padding:"11px 0", background:TEAL, color:"#fff", border:"none", borderRadius:6, fontSize:13, fontWeight:700, cursor:"pointer", marginBottom:14 }}>설치 가능 여부 확인하기</button>}
            {result&&(
              <div style={{ background:rMap[result].bg, border:`1px solid ${rMap[result].border}`, borderRadius:8, padding:"12px 16px", marginBottom:14 }}>
                <div style={{ fontSize:13, fontWeight:700, color:rMap[result].color, marginBottom:4 }}>{rMap[result].icon} {rMap[result].label}</div>
                <div style={{ fontSize:12, color:"#555" }}>{rMap[result].text}</div>
              </div>
            )}
            {result==="ok"&&(
              <div style={{ marginBottom:14 }}>
                <div style={{ fontSize:13, fontWeight:700, marginBottom:10 }}>서류 업로드</div>
                {[["biz","사업자등록증"],["id","신분증"],["bank","통장사본"]].map(([key,label])=>(
                  <div key={key} style={{ display:"flex", gap:8, marginBottom:8 }}>

                ))}

            )}

            </div>
          </div>

      );
    };

    /* ── S12 완료 ── */
    const S12 = ({ go }) => (
      <div style={{ minHeight:"100vh", background:LIGHT_BG, display:"flex", alignItems:"center", justifyContent:"center", padding:16 }}>

          <div style={{ textAlign:"center", marginBottom:24 }}>
            <div style={{ fontSize:44, marginBottom:10 }}>🎉</div><Logo />
            <div style={{ fontSize:16, fontWeight:700, marginTop:12, marginBottom:4 }}>모든 접수가 완료됐습니다!</div>
            <div style={{ fontSize:12, color:"#888" }}>신청하신 서비스 현황을 확인해주세요.</div>
          </div>
          {[
            { icon:"✅", color:TEAL,     title:"아카데미업 정식 계정", status:"활성화 완료",                     bg:"#F0FBF7", border:"#A8DFC4" },
            { icon:"💳", color:"#378ADD", title:"비대면결제",           status:"접수 완료 — 처리 중 (1~3일 소요)", bg:"#F0F7FF", border:"#A8C4F0" },

          ].map(s=>(
            <div key={s.title} style={{ background:s.bg, border:`1px solid ${s.border}`, borderRadius:8, padding:"12px 14px", marginBottom:8, display:"flex", alignItems:"center", gap:10 }}>
              <div style={{ fontSize:20 }}>{s.icon}</div>
              <div><div style={{ fontSize:13, fontWeight:700, color:s.color }}>{s.title}</div><div style={{ fontSize:11, color:"#666" }}>{s.status}</div></div>

          ))}
          <div style={{ background:"#F8F9FA", borderRadius:8, padding:"10px 14px", fontSize:11, color:"#888", marginBottom:16 }}>📊 미신청 서비스는 대시보드에서 언제든 추가 신청 가능합니다.</div>
          <button onClick={()=>go(12)} style={{ width:"100%", padding:"12px 0", background:ORANGE, color:"#fff", border:"none", borderRadius:6, fontSize:14, fontWeight:700, cursor:"pointer" }}>대시보드 바로 가기 →</button>
          <div style={{ textAlign:"center", marginTop:12, fontSize:11, color:"#aaa" }}>문의: 1811-3435 (평일 09:00~18:00)</div>
        </div>
      </div>
    );

    /* ── S13 정식 대시보드 ── */
    const S13 = () => (
      <div style={{ minHeight:"100vh", background:LIGHT_BG }}>
        <GnbHeader isLocked={false} />
        <div style={{ background:TEAL, color:"#fff", padding:"8px 16px", display:"flex", alignItems:"center", justifyContent:"space-between", fontSize:12, flexWrap:"wrap", gap:8 }}>
          <span>🎉 정식 계정 활성화! 모든 기능을 제한 없이 사용하실 수 있습니다.</span>
          <span style={{ fontSize:10, opacity:0.8 }}>비대면결제 처리 중 · 단말기 방문 일정 조율 예정</span>
        </div>
        <div style={{ padding:"16px", display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12 }}>

              <span style={{ fontWeight:700, fontSize:13 }}>수강생현황</span>
              <button style={{ background:TEAL, color:"#fff", border:"none", borderRadius:4, padding:"3px 8px", fontSize:10 }}>신규등록</button>
            </div>
            <div style={{ display:"flex", justifyContent:"space-around", textAlign:"center" }}>
              {[["재원","8명","#333"],["예비","2명",ORANGE],["퇴원","1명","#aaa"]].map(([l,v,c])=>(
                <div key={l}><div style={{ fontSize:10, color:"#888" }}>{l}</div><div style={{ fontSize:20, fontWeight:700, color:c }}>{v}</div></div>
              ))}
            </div>
          </div>
          <div style={{ background:"#fff", borderRadius:8, padding:16, border:"1px solid #e5e5e5" }}>
            <div style={{ fontWeight:700, fontSize:13, marginBottom:12 }}>등원현황</div>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:16 }}>
              <div style={{ width:60, height:60, borderRadius:"50%", border:`5px solid ${ORANGE}`, display:"flex", alignItems:"center", justifyContent:"center", flexDirection:"column" }}>
                <div style={{ fontSize:13, fontWeight:700 }}>60%</div><div style={{ fontSize:9, color:"#888" }}>출석</div>
              </div>
              <div style={{ fontSize:11 }}>
                <div style={{ marginBottom:3 }}>■ 등원대상 10명</div>
                <div style={{ marginBottom:3, color:ORANGE }}>■ 출석 6명</div>
                <div style={{ color:"#aaa" }}>■ 미출석 4명</div>
              </div>
            </div>
          </div>
          <div style={{ background:"#fff", borderRadius:8, padding:16, border:"1px solid #e5e5e5" }}>
            <div style={{ fontWeight:700, fontSize:13, marginBottom:10 }}>수납현황</div>
            <div style={{ background:"#f0f0f0", borderRadius:6, height:6, marginBottom:6 }}><div style={{ height:6, background:TEAL, borderRadius:6, width:"35%" }} /></div>

          </div>
        </div>
        <div style={{ padding:"0 16px 16px", display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:10 }}>
          {[["💬","알림톡 발송"],["🤖","AI 이탈률"],["📊","엑셀 내보내기"],["📑","노무/회계"]].map(([icon,label])=>(
            <div key={label} style={{ background:"#fff", borderRadius:8, padding:12, border:"1px solid #e5e5e5", textAlign:"center", cursor:"pointer" }}>

      const screens = [
        React.createElement(S1,  { go:setScreen }),
        React.createElement(S2,  { go:setScreen }),
        React.createElement(S3,  { go:setScreen }),
        React.createElement(S4,  { go:setScreen }),
        React.createElement(S5,  { go:setScreen }),
        React.createElement(S6,  { go:setScreen }),
        React.createElement(S7,  { go:setScreen }),
        React.createElement(S8,  { go:setScreen }),
        React.createElement(S9,  { go:setScreen }),
        React.createElement(S10, { go:setScreen }),
        React.createElement(S11, { go:setScreen }),
        React.createElement(S12, { go:setScreen }),
        React.createElement(S13, null),
      ];
      return (
        <div>
          {/* 하단 네비게이션 */}
          <div style={{ position:"fixed", bottom:0, left:0, right:0, background:"#1E2235", zIndex:9999, padding:"6px 10px", display:"flex", gap:3, overflowX:"auto" }}>
            {labels.map((l,i)=>(
              <button key={i} onClick={()=>setScreen(i)}
                style={{ padding:"4px 8px", background:screen===i?ORANGE:"rgba(255,255,255,0.1)", color:screen===i?"#fff":"#aaa", border:"none", borderRadius:4, fontSize:10, cursor:"pointer", whiteSpace:"nowrap", fontWeight:screen===i?700:400, flexShrink:0 }}>
                {i+1}. {l}
              </button>
            ))}
          </div>
          <div style={{ paddingBottom:40 }}>{screens[screen]}</div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
