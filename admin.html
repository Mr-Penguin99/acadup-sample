<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아카데미UP — 관리자</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #F0F2F5; }
    input, select, button, textarea { font-family: inherit; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const ORANGE = "#F5841F";
    const TEAL = "#17B8B8";
    const DARK = "#1E2235";
    const RED = "#E8445A";
    const GREEN = "#2CBB6A";
    const BLUE = "#378ADD";
    const BG = "#F0F2F5";

    const Logo = () => (
      <span style={{ fontWeight:900, fontSize:18, letterSpacing:-1 }}>
        <span style={{ color:"#E8445A" }}>아</span>
        <span style={{ color:"#F5841F" }}>카</span>
        <span style={{ color:"#2CBB6A" }}>데</span>
        <span style={{ color:"#F5C518" }}>미</span>
        <span style={{ color:"#fff" }}>UP</span>
        <span style={{ color:"#aaa", fontSize:11, fontWeight:400, marginLeft:6 }}>관리자</span>
      </span>
    );

    // 샘플 데이터
    const ACADEMIES = [
      { id:1, name:"장상미영어학원", owner:"장상미", phone:"010-1234-5678", region:"대구", joinDate:"2026-04-23", status:"정식", trial_d:null, pay:true, terminal:true, alimtalk:3200, login:"오늘" },
      { id:2, name:"수학의정석학원", owner:"김정석", phone:"010-2345-6789", region:"대전", joinDate:"2026-04-22", status:"체험", trial_d:6, pay:false, terminal:false, alimtalk:0, login:"오늘" },
      { id:3, name:"영재수학학원", owner:"이영재", phone:"010-3456-7890", region:"서울", joinDate:"2026-04-21", status:"체험", trial_d:5, pay:false, terminal:false, alimtalk:0, login:"어제" },
      { id:4, name:"한빛국어학원", owner:"박한빛", phone:"010-4567-8901", region:"대구", joinDate:"2026-04-20", status:"체험", trial_d:4, pay:true, terminal:false, alimtalk:0, login:"2일전" },
      { id:5, name:"하늘피아노학원", owner:"최하늘", phone:"010-5678-9012", region:"전주", joinDate:"2026-04-19", status:"체험", trial_d:3, pay:false, terminal:false, alimtalk:0, login:"3일전" },
      { id:6, name:"미래과학학원", owner:"정미래", phone:"010-6789-0123", region:"대전", joinDate:"2026-04-18", status:"체험", trial_d:2, pay:false, terminal:false, alimtalk:0, login:"오늘" },
      { id:7, name:"청운중학교보습", owner:"한청운", phone:"010-7890-1234", region:"대구", joinDate:"2026-04-17", status:"체험", trial_d:1, pay:false, terminal:true, alimtalk:0, login:"5일전" },
      { id:8, name:"두뇌개발학원", owner:"오두뇌", phone:"010-8901-2345", region:"서울", joinDate:"2026-04-16", status:"만료", trial_d:0, pay:false, terminal:false, alimtalk:0, login:"7일전" },
      { id:9, name:"글로벌영어학원", owner:"서글로", phone:"010-9012-3456", region:"부산", joinDate:"2026-04-15", status:"정식", trial_d:null, pay:true, terminal:true, alimtalk:1800, login:"오늘" },
      { id:10, name:"탑수학학원", owner:"윤탑수", phone:"010-0123-4567", region:"대전", joinDate:"2026-04-14", status:"이탈", trial_d:null, pay:false, terminal:false, alimtalk:0, login:"14일전" },
    ];

    const PAY_APPS = [
      { id:1, academy:"한빛국어학원", owner:"박한빛", phone:"010-4567-8901", region:"대구", applyDate:"2026-04-20", status:"검토중", biz:true, bank:true, memo:"" },
      { id:2, academy:"글로벌영어학원", owner:"서글로", phone:"010-9012-3456", region:"부산", applyDate:"2026-04-15", status:"완료", biz:true, bank:true, memo:"처리완료" },
      { id:3, academy:"미래과학학원", owner:"정미래", phone:"010-6789-0123", region:"대전", applyDate:"2026-04-18", status:"접수", biz:true, bank:false, memo:"통장사본 미제출" },
    ];

    const TERMINAL_APPS = [
      { id:1, academy:"장상미영어학원", owner:"장상미", phone:"010-1234-5678", region:"대구", applyDate:"2026-04-10", status:"설치완료", check:"ok", scheduledDate:"2026-04-15", memo:"" },
      { id:2, academy:"청운중학교보습", owner:"한청운", phone:"010-7890-1234", region:"대구", applyDate:"2026-04-17", status:"일정조율", check:"ok", scheduledDate:"", memo:"대구 묶음 출장 검토" },
      { id:3, academy:"글로벌영어학원", owner:"서글로", phone:"010-9012-3456", region:"부산", applyDate:"2026-04-15", status:"설치완료", check:"ok", scheduledDate:"2026-04-20", memo:"" },
    ];

    // 뱃지 컴포넌트
    const Badge = ({ label, color, bg }) => (
      <span style={{ background:bg||`${color}18`, color:color, fontSize:10, padding:"2px 8px", borderRadius:10, fontWeight:700, whiteSpace:"nowrap" }}>{label}</span>
    );

    const statusBadge = (s, d) => {
      if(s==="정식") return <Badge label="정식" color={TEAL} />;
      if(s==="체험") {
        const c = d<=1 ? RED : d<=3 ? ORANGE : GREEN;
        return <Badge label={`체험 D-${d}`} color={c} />;
      }
      if(s==="만료") return <Badge label="만료" color="#888" />;
      if(s==="이탈") return <Badge label="이탈" color={RED} bg="#ffeeee" />;
      return null;
    };

    // ── 로그인 화면 ──
    const Login = ({ onLogin }) => {
      const [id, setId] = useState("");
      const [pw, setPw] = useState("");
      const [err, setErr] = useState(false);
      const submit = () => {
        if(id==="admin" && pw==="1234") onLogin();
        else setErr(true);
      };
      return (
        <div style={{ minHeight:"100vh", background:DARK, display:"flex", alignItems:"center", justifyContent:"center" }}>
          <div style={{ background:"#fff", borderRadius:12, width:360, padding:36, boxShadow:"0 20px 60px rgba(0,0,0,0.4)" }}>
            <div style={{ textAlign:"center", marginBottom:28 }}>
              <span style={{ fontWeight:900, fontSize:22, letterSpacing:-1 }}>
                <span style={{ color:"#E8445A" }}>아</span><span style={{ color:"#F5841F" }}>카</span>
                <span style={{ color:"#2CBB6A" }}>데</span><span style={{ color:"#F5C518" }}>미</span>
                <span style={{ color:DARK }}>UP</span>
              </span>
              <div style={{ fontSize:12, color:"#888", marginTop:6 }}>관리자 전용 페이지</div>
            </div>
            <div style={{ marginBottom:12 }}>
              <label style={{ fontSize:12, fontWeight:600, color:"#444", display:"block", marginBottom:5 }}>아이디</label>
              <input value={id} onChange={e=>{setId(e.target.value);setErr(false);}} placeholder="관리자 아이디"
                onKeyDown={e=>e.key==="Enter"&&submit()}
                style={{ width:"100%", padding:"10px 12px", border:`1px solid ${err?"#E8445A":"#ddd"}`, borderRadius:6, fontSize:13, outline:"none" }} />
            </div>
            <div style={{ marginBottom:20 }}>
              <label style={{ fontSize:12, fontWeight:600, color:"#444", display:"block", marginBottom:5 }}>비밀번호</label>
              <input type="password" value={pw} onChange={e=>{setPw(e.target.value);setErr(false);}} placeholder="비밀번호"
                onKeyDown={e=>e.key==="Enter"&&submit()}
                style={{ width:"100%", padding:"10px 12px", border:`1px solid ${err?"#E8445A":"#ddd"}`, borderRadius:6, fontSize:13, outline:"none" }} />
            </div>
            {err && <div style={{ background:"#FFF0F0", border:"1px solid #F0A8A8", borderRadius:6, padding:"8px 12px", fontSize:12, color:RED, marginBottom:14 }}>아이디 또는 비밀번호가 올바르지 않습니다.</div>}
            <button onClick={submit} style={{ width:"100%", padding:"12px 0", background:ORANGE, color:"#fff", border:"none", borderRadius:6, fontSize:14, fontWeight:700, cursor:"pointer" }}>로그인</button>
            <div style={{ textAlign:"center", marginTop:16, fontSize:11, color:"#aaa" }}>테스트 계정: admin / 1234</div>
          </div>
        </div>
      );
    };

    // ── 사이드바 ──
    const Sidebar = ({ menu, setMenu }) => {
      const items = [
        { key:"dashboard", icon:"📊", label:"대시보드" },
        { key:"academies", icon:"🏫", label:"신규 가입 학원", badge:10 },
        { key:"payment", icon:"💳", label:"비대면결제 접수", badge:2 },
        { key:"terminal", icon:"🖥️", label:"단말기 신청 현황", badge:1 },
        { key:"alimtalk", icon:"💬", label:"알림톡 발송 현황" },
        { key:"revenue", icon:"💰", label:"수익 현황" },
      ];
      return (
        <div style={{ width:200, background:DARK, minHeight:"100vh", display:"flex", flexDirection:"column", flexShrink:0 }}>
          <div style={{ padding:"20px 16px 16px", borderBottom:"1px solid rgba(255,255,255,0.08)" }}>
            <Logo />
          </div>
          <nav style={{ padding:"12px 8px", flex:1 }}>
            {items.map(item=>(
              <div key={item.key} onClick={()=>setMenu(item.key)}
                style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 12px", borderRadius:8, cursor:"pointer", marginBottom:2, background:menu===item.key?"rgba(245,132,31,0.15)":"transparent", color:menu===item.key?"#F5841F":"#aaa" }}>
                <span style={{ fontSize:15 }}>{item.icon}</span>
                <span style={{ fontSize:12, fontWeight:menu===item.key?700:400, flex:1 }}>{item.label}</span>
                {item.badge && <span style={{ background:RED, color:"#fff", fontSize:9, padding:"1px 6px", borderRadius:10, fontWeight:700 }}>{item.badge}</span>}
              </div>
            ))}
          </nav>
          <div style={{ padding:"12px 16px", borderTop:"1px solid rgba(255,255,255,0.08)", fontSize:11, color:"#555" }}>
            관리자 계정<br/>
            <span style={{ color:"#777" }}>admin@acadup.co.kr</span>
          </div>
        </div>
      );
    };

    // ── 대시보드 ──
    const Dashboard = ({ setMenu }) => {
      const cards = [
        { label:"오늘 신규 체험", value:3, color:GREEN, icon:"🆕", sub:"전일 대비 +1" },
        { label:"정식 전환 학원", value:2, color:TEAL, icon:"✅", sub:"이번 주 누적" },
        { label:"비대면결제 접수", value:2, color:BLUE, icon:"💳", sub:"검토 필요" },
        { label:"단말기 신청", value:1, color:ORANGE, icon:"🖥️", sub:"일정 조율 필요" },
      ];
      const urgent = [
        { type:"warning", msg:"D-1 만료 예정 학원", detail:"청운중학교보습 — 알림톡 미발송", action:"알림톡 발송" },
        { type:"warning", msg:"D-2 만료 예정 학원", detail:"미래과학학원 — 전환 유도 필요", action:"알림톡 발송" },
        { type:"info", msg:"비대면결제 서류 검토", detail:"미래과학학원 — 통장사본 미제출", action:"확인하기" },
        { type:"info", msg:"단말기 출장 대기", detail:"대구 지역 2곳 — 묶음 출장 검토", action:"일정 잡기" },
        { type:"danger", msg:"장기 미접속 학원", detail:"탑수학학원 — 14일째 미접속", action:"연락하기" },
      ];
      return (
        <div style={{ padding:24 }}>
          <div style={{ fontSize:18, fontWeight:700, marginBottom:4 }}>대시보드</div>
          <div style={{ fontSize:12, color:"#888", marginBottom:24 }}>2026년 04월 23일 기준</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:16, marginBottom:24 }}>
            {cards.map(c=>(
              <div key={c.label} style={{ background:"#fff", borderRadius:10, padding:20, border:"1px solid #e5e5e5", borderLeft:`4px solid ${c.color}` }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
                  <div>
                    <div style={{ fontSize:11, color:"#888", marginBottom:6 }}>{c.label}</div>
                    <div style={{ fontSize:28, fontWeight:700, color:c.color }}>{c.value}</div>
                    <div style={{ fontSize:10, color:"#aaa", marginTop:4 }}>{c.sub}</div>
                  </div>
                  <span style={{ fontSize:24, opacity:0.4 }}>{c.icon}</span>
                </div>
              </div>
            ))}
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16 }}>
            <div style={{ background:"#fff", borderRadius:10, padding:20, border:"1px solid #e5e5e5" }}>
              <div style={{ fontSize:14, fontWeight:700, marginBottom:16, display:"flex", alignItems:"center", gap:8 }}>
                <span>⚠️</span> 오늘 처리 필요
              </div>
              {urgent.map((u,i)=>(
                <div key={i} style={{ display:"flex", alignItems:"center", gap:12, padding:"10px 12px", background: u.type==="danger"?"#FFF0F0":u.type==="warning"?"#FFFBE8":"#F0F7FF", borderRadius:8, marginBottom:8, border:`1px solid ${u.type==="danger"?"#F0A8A8":u.type==="warning"?"#F0DFA8":"#A8C4F0"}` }}>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:12, fontWeight:700, color: u.type==="danger"?RED:u.type==="warning"?ORANGE:BLUE }}>{u.msg}</div>
                    <div style={{ fontSize:11, color:"#666", marginTop:2 }}>{u.detail}</div>
                  </div>
                  <button style={{ background: u.type==="danger"?RED:u.type==="warning"?ORANGE:BLUE, color:"#fff", border:"none", borderRadius:4, padding:"4px 10px", fontSize:10, fontWeight:700, cursor:"pointer", whiteSpace:"nowrap" }}>{u.action}</button>
                </div>
              ))}
            </div>
            <div style={{ background:"#fff", borderRadius:10, padding:20, border:"1px solid #e5e5e5" }}>
              <div style={{ fontSize:14, fontWeight:700, marginBottom:16 }}>📈 이번 주 요약</div>
              {[
                ["신규 체험 계정", "8건", GREEN],
                ["정식 전환", "2건", TEAL],
                ["비대면결제 완료", "1건", BLUE],
                ["단말기 설치 완료", "0건", "#888"],
                ["알림톡 발송 (시스템)", "24건", ORANGE],
                ["이탈 학원", "1건", RED],
              ].map(([label,val,color])=>(
                <div key={label} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"8px 0", borderBottom:"1px solid #f5f5f5" }}>
                  <span style={{ fontSize:12, color:"#555" }}>{label}</span>
                  <span style={{ fontSize:13, fontWeight:700, color }}>{val}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // ── 신규 가입 학원 ──
    const Academies = () => {
      const [filter, setFilter] = useState("전체");
      const [search, setSearch] = useState("");
      const [selected, setSelected] = useState(null);
      const filters = ["전체","체험","정식","만료","이탈"];
      const filtered = ACADEMIES.filter(a=>{
        const matchStatus = filter==="전체" || a.status===filter;
        const matchSearch = a.name.includes(search) || a.owner.includes(search) || a.region.includes(search);
        return matchStatus && matchSearch;
      });
      return (
        <div style={{ padding:24 }}>
          <div style={{ fontSize:18, fontWeight:700, marginBottom:4 }}>신규 가입 학원</div>
          <div style={{ fontSize:12, color:"#888", marginBottom:20 }}>전체 가입 학원 현황 및 전환 관리</div>
          {/* 필터 + 검색 */}
          <div style={{ display:"flex", gap:8, marginBottom:16, alignItems:"center" }}>
            {filters.map(f=>(
              <button key={f} onClick={()=>setFilter(f)}
                style={{ padding:"6px 14px", border:`1.5px solid ${filter===f?ORANGE:"#ddd"}`, borderRadius:20, background:filter===f?"#FFF9F3":"#fff", color:filter===f?ORANGE:"#666", fontSize:12, fontWeight:filter===f?700:400, cursor:"pointer" }}>
                {f}
              </button>
            ))}
            <div style={{ marginLeft:"auto", display:"flex", gap:8 }}>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="학원명 / 원장명 / 지역 검색"
                style={{ padding:"7px 12px", border:"1px solid #ddd", borderRadius:6, fontSize:12, width:220, outline:"none" }} />
            </div>
          </div>
          {/* 테이블 */}
          <div style={{ background:"#fff", borderRadius:10, border:"1px solid #e5e5e5", overflow:"hidden" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
              <thead>
                <tr style={{ background:"#F8F9FA", borderBottom:"2px solid #e5e5e5" }}>
                  {["학원명","원장","지역","가입일","상태","비대면","단말기","최근접속","액션"].map(h=>(
                    <th key={h} style={{ padding:"11px 14px", textAlign:"left", color:"#555", fontWeight:700, whiteSpace:"nowrap" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtered.map((a,i)=>(
                  <tr key={a.id} onClick={()=>setSelected(selected?.id===a.id?null:a)}
                    style={{ borderBottom:"1px solid #f0f0f0", background:selected?.id===a.id?"#FFF9F3":"#fff", cursor:"pointer" }}>
                    <td style={{ padding:"11px 14px", fontWeight:600, color:DARK }}>{a.name}</td>
                    <td style={{ padding:"11px 14px", color:"#555" }}>{a.owner}</td>
                    <td style={{ padding:"11px 14px", color:"#555" }}>{a.region}</td>
                    <td style={{ padding:"11px 14px", color:"#888" }}>{a.joinDate}</td>
                    <td style={{ padding:"11px 14px" }}>{statusBadge(a.status, a.trial_d)}</td>
                    <td style={{ padding:"11px 14px" }}>{a.pay ? <Badge label="완료" color={TEAL} /> : <Badge label="미신청" color="#aaa" />}</td>
                    <td style={{ padding:"11px 14px" }}>{a.terminal ? <Badge label="신청완료" color={BLUE} /> : <Badge label="미신청" color="#aaa" />}</td>
                    <td style={{ padding:"11px 14px", color: a.login==="14일전"?RED:a.login==="7일전"?ORANGE:"#555" }}>{a.login}</td>
                    <td style={{ padding:"11px 14px" }}>
                      <div style={{ display:"flex", gap:4 }}>
                        <button onClick={e=>{e.stopPropagation();}} style={{ padding:"3px 8px", background:ORANGE, color:"#fff", border:"none", borderRadius:4, fontSize:10, cursor:"pointer" }}>알림톡</button>
                        {a.status==="체험" && <button onClick={e=>{e.stopPropagation();}} style={{ padding:"3px 8px", background:TEAL, color:"#fff", border:"none", borderRadius:4, fontSize:10, cursor:"pointer" }}>전환유도</button>}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {/* 상세 패널 */}
          {selected && (
            <div style={{ background:"#fff", borderRadius:10, border:"1px solid #e5e5e5", padding:20, marginTop:16 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
                <div style={{ fontSize:15, fontWeight:700 }}>{selected.name} 상세</div>
                <button onClick={()=>setSelected(null)} style={{ background:"none", border:"none", fontSize:18, cursor:"pointer", color:"#888" }}>✕</button>
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12, marginBottom:16 }}>
