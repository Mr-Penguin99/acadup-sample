        <div style={{fontSize:18,fontWeight:700,marginBottom:4}}>알림톡 발송 현황</div>
        <div style={{fontSize:12,color:"#888",marginBottom:20}}>시스템 자동 발송 및 수동 발송 이력</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16,marginBottom:20}}>
          {[["이번 달 총 발송","24건",ORANGE],["발송 성공률","100%",GREEN],["이번 달 비용","192원",BLUE]].map(([l,v,c])=>(
            <div key={l} style={{background:"#fff",borderRadius:10,padding:18,border:"1px solid #e5e5e5",borderLeft:`4px solid ${c}`}}>
              <div style={{fontSize:11,color:"#888",marginBottom:6}}>{l}</div>
              <div style={{fontSize:24,fontWeight:700,color:c}}>{v}</div>
            </div>
          ))}
        </div>
        <div style={{background:"#fff",borderRadius:10,border:"1px solid #e5e5e5",overflow:"hidden"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead>
              <tr style={{background:"#F8F9FA",borderBottom:"2px solid #e5e5e5"}}>
                {["발송일시","대상","발송 유형","건수","상태"].map(h=>(
                  <th key={h} style={{padding:"11px 14px",textAlign:"left",color:"#555",fontWeight:700}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {ALIMTALK_LOGS.map((l,i)=>(
                <tr key={i} style={{borderBottom:"1px solid #f0f0f0"}}>
                  <td style={{padding:"10px 14px",color:"#888"}}>{l.date}</td>
                  <td style={{padding:"10px 14px",fontWeight:600}}>{l.academy}</td>
                  <td style={{padding:"10px 14px",color:"#555"}}>{l.type}</td>
                  <td style={{padding:"10px 14px",color:"#555"}}>{l.count}건</td>
                  <td style={{padding:"10px 14px"}}><Badge label={l.status} color={GREEN}/></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    );

    const Revenue = () => (
      <div style={{padding:24}}>
        <div style={{fontSize:18,fontWeight:700,marginBottom:4}}>수익 현황</div>
        <div style={{fontSize:12,color:"#888",marginBottom:20}}>2026년 04월 기준</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16,marginBottom:20}}>
          {[
            {label:"알림톡 마진",value:"215,000원",sub:"50개 학원 × 1,000건 × 4.3원",color:ORANGE},
            {label:"비대면결제 마진",value:"1,940,000원",sub:"20개 학원 평균 중소2 기준",color:BLUE},
            {label:"단말기 VAN 수수료",value:"1,249,000원",sub:"20개 단말기 × 평균 37건",color:TEAL},
          ].map(c=>(
            <div key={c.label} style={{background:"#fff",borderRadius:10,padding:20,border:"1px solid #e5e5e5",borderLeft:`4px solid ${c.color}`}}>
              <div style={{fontSize:11,color:"#888",marginBottom:6}}>{c.label}</div>
              <div style={{fontSize:22,fontWeight:700,color:c.color}}>{c.value}</div>
              <div style={{fontSize:10,color:"#aaa",marginTop:4}}>{c.sub}</div>
            </div>
          ))}
        </div>
        <div style={{background:"#fff",borderRadius:10,border:"1px solid #e5e5e5",padding:20}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <div style={{fontSize:14,fontWeight:700}}>월 합계</div>
            <div style={{fontSize:22,fontWeight:700,color:GREEN}}>3,404,000원</div>
          </div>
          <div style={{background:"#F8F9FA",borderRadius:8,padding:14,fontSize:12,color:"#666",lineHeight:1.8}}>
            💡 단말기가 활성화된 학원이 늘어날수록 VAN 수수료가 수익의 핵심이 됩니다.<br/>
            현재 29개 단말기 중 실질 수익 기여는 소수 — 비대면결제 연동 확대가 최우선 과제입니다.
          </div>
        </div>
      </div>
    );

    const App = () => {
      const [loggedIn,setLoggedIn]=useState(false);
      const [menu,setMenu]=useState("dashboard");
      if(!loggedIn) return React.createElement(Login,{onLogin:()=>setLoggedIn(true)});
      return (
        <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
          <TopNav menu={menu} setMenu={setMenu} onLogout={()=>setLoggedIn(false)}/>
          <div style={{flex:1}}>
            {menu==="dashboard"&&React.createElement(Dashboard,{setMenu})}
            {menu==="academies"&&React.createElement(Academies)}
            {menu==="payment"&&React.createElement(Payment)}
            {menu==="terminal"&&React.createElement(Terminal)}
            {menu==="alimtalk"&&React.createElement(Alimtalk)}
            {menu==="revenue"&&React.createElement(Revenue)}
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
